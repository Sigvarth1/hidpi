<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390" role="img" aria-labelledby="title desc">
  <title id="title">How display modes are discovered</title>
  <desc id="desc">The display driver generates every mode. The public macOS API filters out most HiDPI modes on non-Retina displays. HiDPI reads the full list through the private SkyLight API, validates it, and uses it if every check passes; otherwise it falls back to the public list.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .t{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#59636e;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
    .accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .warn{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
    .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .line{stroke:#8c959f;stroke-width:1.6;fill:none}
    .dash{stroke:#8c959f;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#8c959f}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .t{fill:#e6edf3}
      .s,.lbl{fill:#9198a1}
      .box{fill:#161b22;stroke:#6e7681}
      .accent{fill:#0c2d6b;stroke:#4493f8}
      .warn{fill:#341a00;stroke:#d29922}
      .ok{fill:#033a16;stroke:#3fb950}
      .line,.dash{stroke:#6e7681}
      .arrow{fill:#6e7681}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="389" rx="12"/>

  <rect class="box" x="20" y="150" width="160" height="80" rx="10"/>
  <text class="t" x="100" y="184" text-anchor="middle">Display driver</text>
  <text class="s" x="100" y="205" text-anchor="middle">generates every mode</text>

  <path class="line" d="M182 178C214 178 210 76 236 76" marker-end="url(#a)"/>
  <path class="line" d="M182 202C214 202 210 304 236 304" marker-end="url(#a)"/>

  <rect class="box" x="240" y="40" width="250" height="72" rx="10"/>
  <text class="t" x="365" y="71" text-anchor="middle">Public macOS API</text>
  <text class="s" x="365" y="92" text-anchor="middle">most HiDPI modes filtered out</text>

  <rect class="accent" x="240" y="268" width="250" height="72" rx="10"/>
  <text class="t" x="365" y="299" text-anchor="middle">Private SkyLight API</text>
  <text class="s" x="365" y="320" text-anchor="middle">full list · raw 212-byte records</text>

  <path class="line" d="M492 304H526" marker-end="url(#a)"/>

  <rect class="warn" x="530" y="242" width="200" height="124" rx="10"/>
  <text class="t" x="550" y="270">Validation</text>
  <text class="s" x="550" y="295">✓ sane sizes and refresh</text>
  <text class="s" x="550" y="317">✓ duplicates removed</text>
  <text class="s" x="550" y="339">✓ contains current mode</text>

  <path class="line" d="M732 290C760 290 754 206 776 206" marker-end="url(#a)"/>
  <text class="lbl" x="772" y="262">all pass</text>

  <path class="dash" d="M492 76C640 76 720 174 776 174" marker-end="url(#a)"/>
  <text class="lbl" x="520" y="62">fallback if any check fails</text>

  <rect class="ok" x="780" y="150" width="120" height="80" rx="10"/>
  <text class="t" x="840" y="184" text-anchor="middle">Mode menu</text>
  <text class="s" x="840" y="205" text-anchor="middle">source shown</text>
</svg>
