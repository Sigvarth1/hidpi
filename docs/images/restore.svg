<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Automatic restore</title>
  <desc id="desc">Startup or wake restores every monitor and a connected monitor restores only that monitor, through a coordinator that waits, retries and merges events before restoring in one shared change. Changes made in System Settings are adopted as the new remembered mode under safe conditions.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .t{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#59636e;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
    .accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .warn{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
    .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .line{stroke:#8c959f;stroke-width:1.6;fill:none}
    .arrow{fill:#8c959f}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .t{fill:#e6edf3}
      .s{fill:#9198a1}
      .box{fill:#161b22;stroke:#6e7681}
      .accent{fill:#0c2d6b;stroke:#4493f8}
      .warn{fill:#341a00;stroke:#d29922}
      .ok{fill:#033a16;stroke:#3fb950}
      .line{stroke:#6e7681}
      .arrow{fill:#6e7681}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="299" rx="12"/>

  <rect class="box" x="20" y="24" width="230" height="62" rx="10"/>
  <text class="t" x="38" y="50">Startup or wake</text>
  <text class="s" x="38" y="70">restore every monitor</text>

  <rect class="box" x="20" y="104" width="230" height="62" rx="10"/>
  <text class="t" x="38" y="130">Monitor connected</text>
  <text class="s" x="38" y="150">restore only that monitor</text>

  <rect class="box" x="20" y="208" width="230" height="68" rx="10"/>
  <text class="t" x="38" y="235">Changed in System Settings</text>
  <text class="s" x="38" y="256">remember the new mode</text>

  <path class="line" d="M252 55C285 55 285 84 316 84" marker-end="url(#a)"/>
  <path class="line" d="M252 135C285 135 285 114 316 114" marker-end="url(#a)"/>

  <rect class="accent" x="320" y="24" width="270" height="142" rx="10"/>
  <text class="t" x="340" y="52">Restore coordinator</text>
  <text class="s" x="340" y="77">waits 2 s for displays to settle</text>
  <text class="s" x="340" y="98">retries after 3 s and 5 s more</text>
  <text class="s" x="340" y="119">merges bursts of plug-in events</text>
  <text class="s" x="340" y="140">cancelled by manual changes or Pause</text>

  <path class="line" d="M592 95H626" marker-end="url(#a)"/>

  <rect class="ok" x="630" y="24" width="270" height="142" rx="10"/>
  <text class="t" x="650" y="52">Restore</text>
  <text class="s" x="650" y="77">skip monitors already correct</text>
  <text class="s" x="650" y="98">one shared change → one flash</text>
  <text class="s" x="650" y="119">per-monitor fallback on failure</text>
  <text class="s" x="650" y="140">result in menu icon + Diagnostics</text>

  <path class="line" d="M252 242H316" marker-end="url(#a)"/>

  <rect class="warn" x="320" y="196" width="580" height="92" rx="10"/>
  <text class="t" x="340" y="223">Adopt, only when it is safe</text>
  <text class="s" x="340" y="246">only while System Settings is the frontmost app · only for monitors HiDPI restores</text>
  <text class="s" x="340" y="268">ignored for 15 s after a wake or reconnect, when macOS may reset modes itself</text>
</svg>
