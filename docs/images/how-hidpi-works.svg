<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="title desc">
  <title id="title">How HiDPI rendering works</title>
  <desc id="desc">Standard 1920 by 1080 is drawn at 1920 by 1080 pixels and stretched up to a 2560 by 1440 panel, giving soft text. HiDPI 1920 by 1080 is drawn at 3840 by 2160 pixels and scaled down to the panel, giving sharp text at the same size.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .t{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{fill:#1f2328;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#59636e;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .big{fill:#1f2328;font:600 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
    .accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
    .ok{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .bad{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
    .stand{fill:#8c959f}
    .line{stroke:#8c959f;stroke-width:1.6;fill:none}
    .arrow{fill:#8c959f}
    .rule{stroke:#d0d7de;stroke-dasharray:4 4}
    .pill{fill:#f6f8fa;stroke:#d0d7de}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .t,.h,.big{fill:#e6edf3}
      .s{fill:#9198a1}
      .box{fill:#161b22;stroke:#6e7681}
      .accent{fill:#0c2d6b;stroke:#4493f8}
      .ok{fill:#033a16;stroke:#3fb950}
      .bad{fill:#3d1d00;stroke:#db6d28}
      .stand,.arrow{fill:#6e7681}
      .line{stroke:#6e7681}
      .rule{stroke:#30363d}
      .pill{fill:#161b22;stroke:#30363d}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0L10 5L0 10z"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="919" height="499" rx="12"/>

  <!-- column headers -->
  <text class="h" x="260" y="44" text-anchor="middle">① Layout size</text>
  <text class="s" x="260" y="63" text-anchor="middle">what the UI is sized for</text>
  <text class="h" x="520" y="44" text-anchor="middle">② Drawn by macOS</text>
  <text class="s" x="520" y="63" text-anchor="middle">rendering resolution</text>
  <text class="h" x="790" y="44" text-anchor="middle">③ Shown on the panel</text>
  <text class="s" x="790" y="63" text-anchor="middle">2560 × 1440 monitor</text>

  <!-- row 1: standard -->
  <rect class="pill" x="24" y="140" width="112" height="50" rx="8"/>
  <text class="t" x="80" y="161" text-anchor="middle">Standard</text>
  <text class="s" x="80" y="180" text-anchor="middle">1920 × 1080</text>

  <rect class="box" x="202.5" y="132.5" width="115" height="65" rx="3"/>
  <text class="s" x="260" y="170" text-anchor="middle">1920 × 1080 pt</text>
  <path class="line" d="M322 165H452" marker-end="url(#a)"/>
  <text class="s" x="387" y="155" text-anchor="middle">1 px per pt</text>

  <rect class="box" x="462.5" y="132.5" width="115" height="65" rx="3"/>
  <text class="s" x="520" y="170" text-anchor="middle">1920 × 1080 px</text>
  <path class="line" d="M582 165H705" marker-end="url(#a)"/>
  <text class="s" x="644" y="155" text-anchor="middle">stretch ×1.33</text>

  <rect class="bad" x="713" y="122" width="154" height="86" rx="4"/>
  <text class="big" x="790" y="180" text-anchor="middle" filter="url(#soft)">Aa</text>
  <rect class="stand" x="782" y="208" width="16" height="8"/>
  <rect class="stand" x="767" y="216" width="46" height="4" rx="2"/>
  <text class="s" x="790" y="242" text-anchor="middle">upscaled → soft text</text>

  <line class="rule" x1="24" y1="268" x2="896" y2="268"/>

  <!-- row 2: HiDPI -->
  <rect class="pill" x="24" y="330" width="112" height="50" rx="8"/>
  <text class="t" x="80" y="351" text-anchor="middle">HiDPI</text>
  <text class="s" x="80" y="370" text-anchor="middle">1920 × 1080</text>

  <rect class="box" x="202.5" y="322.5" width="115" height="65" rx="3"/>
  <text class="s" x="260" y="360" text-anchor="middle">1920 × 1080 pt</text>
  <path class="line" d="M322 355H396" marker-end="url(#a)"/>
  <text class="s" x="359" y="345" text-anchor="middle">2 px per pt</text>

  <rect class="accent" x="405" y="290" width="230" height="130" rx="3"/>
  <text class="t" x="520" y="350" text-anchor="middle">3840 × 2160 px</text>
  <text class="s" x="520" y="371" text-anchor="middle">4× the pixels</text>
  <path class="line" d="M640 355H705" marker-end="url(#a)"/>
  <text class="s" x="672" y="345" text-anchor="middle">×0.67</text>

  <rect class="ok" x="713" y="312" width="154" height="86" rx="4"/>
  <text class="big" x="790" y="370" text-anchor="middle">Aa</text>
  <rect class="stand" x="782" y="398" width="16" height="8"/>
  <rect class="stand" x="767" y="406" width="46" height="4" rx="2"/>
  <text class="s" x="790" y="432" text-anchor="middle">downscaled → sharp text</text>

  <text class="s" x="460" y="476" text-anchor="middle">Both rows give the same on-screen size. HiDPI draws 4× the pixels, so edges are smoother — at the cost of more GPU work.</text>
</svg>
